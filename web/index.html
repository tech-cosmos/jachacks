<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Continuity Walker — canon graph</title>
<script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<style>
  :root {
    --bg: #0e1116; --panel: #161b23; --line: #2a3240;
    --text: #e6ebf2; --dim: #8b96a5;
    --doc: #e8863a; --scene: #4a5568; --state: #3d7bd9; --req: #8f6fd0;
    --bad: #e5484d; --ok: #46a758; --warn: #f0b429;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text); height: 100vh;
    display: flex; flex-direction: column; overflow: hidden;
    font: 14px/1.5 "SF Mono", ui-monospace, Menlo, monospace;
  }
  header {
    padding: 14px 22px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 16px;
  }
  header h1 { font-size: 17px; letter-spacing: .5px; }
  header .sub { color: var(--dim); font-size: 12px; }
  #score { margin-left: auto; font-size: 13px; color: var(--dim); }
  #score b { color: var(--text); }
  main { flex: 1; display: flex; min-height: 0; }
  #cy { flex: 1.6; min-width: 0; }
  aside {
    flex: 1; max-width: 520px; border-left: 1px solid var(--line);
    background: var(--panel); overflow-y: auto; padding: 16px;
  }
  .v { border: 1px solid var(--line); border-radius: 8px;
       padding: 12px 14px; margin-bottom: 12px; }
  .v .head { display: flex; gap: 10px; align-items: center; margin-bottom: 6px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px;
           font-weight: 700; letter-spacing: .5px; }
  .confirmed .badge { background: var(--bad); color: #fff; }
  .declined  .badge { background: #1e3328; color: var(--ok); }
  .withdrawn .badge { background: #33290f; color: var(--warn); }
  .candidate .badge { background: #333; color: var(--dim); }
  .confirmed { border-color: #5c2426; }
  .v .claim { font-weight: 600; }
  .v .at { color: var(--dim); font-size: 12px; margin-bottom: 8px; }
  .v pre {
    color: var(--dim); font-size: 11.5px; white-space: pre-wrap;
    border-left: 2px solid var(--line); padding-left: 10px; margin: 8px 0;
  }
  .v .why { font-size: 12px; color: #b8c2cf; }
  .empty { color: var(--dim); text-align: center; margin-top: 40px; }
</style>
</head>
<body>
<header>
  <h1>CONTINUITY&nbsp;WALKER</h1>
  <span class="sub">canon graph &middot; live from jac</span>
  <span id="score"></span>
</header>
<main>
  <div id="cy"></div>
  <aside id="panel"><div class="empty">waiting for graph.json…</div></aside>
</main>
<script>
const COLORS = { document: 'var(--doc)' };
let cy = null, lastPayload = '';

function styleFor() {
  return [
    { selector: 'node', style: {
        'label': 'data(label)', 'color': '#e6ebf2', 'font-size': 9,
        'text-wrap': 'wrap', 'text-max-width': 130,
        'text-valign': 'bottom', 'text-margin-y': 4,
        'width': 16, 'height': 16, 'background-color': '#4a5568' }},
    { selector: 'node[type="document"]', style: {
        'shape': 'round-rectangle', 'background-color': '#e8863a',
        'width': 30, 'height': 22, 'font-size': 11, 'font-weight': 700 }},
    { selector: 'node[type="state"]', style: { 'background-color': '#3d7bd9' }},
    { selector: 'node[type="requires"]', style: {
        'background-color': '#8f6fd0', 'shape': 'diamond' }},
    { selector: 'node[type="violation"]', style: {
        'shape': 'star', 'width': 26, 'height': 26,
        'background-color': '#e5484d', 'font-size': 10 }},
    { selector: 'node[type="violation"][status="declined"]',
      style: { 'background-color': '#46a758' }},
    { selector: 'node[type="violation"][status="withdrawn"]',
      style: { 'background-color': '#f0b429' }},
    { selector: 'edge', style: {
        'width': 1, 'line-color': '#2a3240', 'curve-style': 'bezier',
        'target-arrow-shape': 'triangle', 'target-arrow-color': '#2a3240',
        'arrow-scale': .7 }},
    { selector: 'edge[kind="establishes"]', style: { 'line-color': '#2c4f80', 'target-arrow-color': '#2c4f80' }},
    { selector: 'edge[kind="requires"]', style: { 'line-color': '#5d4a85', 'target-arrow-color': '#5d4a85', 'line-style': 'dashed' }},
    { selector: 'edge[kind="transition"]', style: { 'line-color': '#46a758', 'target-arrow-color': '#46a758', 'width': 2 }},
    { selector: 'edge[kind="flags"]', style: { 'line-color': '#e5484d', 'target-arrow-color': '#e5484d', 'width': 2 }},
  ];
}

function render(data) {
  const el = document.getElementById('panel');
  const vs = data.violations || [];
  const n = s => vs.filter(v => v.status === s).length;
  document.getElementById('score').innerHTML =
    `<b>${n('confirmed')}</b> confirmed &middot; <b>${n('declined')}</b> declined ` +
    `&middot; <b>${n('withdrawn')}</b> withdrawn`;
  el.innerHTML = vs.length ? '' : '<div class="empty">no violations — canon is consistent</div>';
  const order = { confirmed: 0, candidate: 1, withdrawn: 2, declined: 3 };
  vs.sort((a, b) => (order[a.status] ?? 9) - (order[b.status] ?? 9));
  for (const v of vs) {
    const d = document.createElement('div');
    d.className = 'v ' + v.status;
    d.innerHTML = `
      <div class="head"><span class="badge">${v.status.toUpperCase()}</span>
        <span class="claim">${v.subject}.${v.predicate}: needs <u>${v.required}</u>, canon has <u>${v.found}</u></span></div>
      <div class="at">${v.at}</div>
      <pre>${v.timeline}</pre>
      <div class="why">${v.reasoning || ''}</div>`;
    el.appendChild(d);
  }
  if (!cy) {
    cy = cytoscape({ container: document.getElementById('cy'),
      elements: data.elements, style: styleFor(),
      layout: { name: 'cose', animate: false, nodeRepulsion: 12000 },
      wheelSensitivity: .2 });
  } else {
    cy.elements().remove();
    cy.add(data.elements);
    cy.layout({ name: 'cose', animate: false, nodeRepulsion: 12000 }).run();
  }
}

async function poll() {
  try {
    const r = await fetch('graph.json?t=' + Date.now());
    if (r.ok) {
      const t = await r.text();
      if (t !== lastPayload) { lastPayload = t; render(JSON.parse(t)); }
    }
  } catch (e) { /* jac not dumped yet */ }
  setTimeout(poll, 2000);
}
poll();
</script>
</body>
</html>
